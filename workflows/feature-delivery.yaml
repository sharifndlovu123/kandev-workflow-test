version: 1
type: kandev_workflow
workflows:
  - name: Feature Delivery
    description: >-
      Spec -> independent multi-agent review -> implement -> test -> code review
      -> human diff gate -> PR (the human merges it). Assumes an approved
      feature doc already exists under the repo's design-doc directory. Two
      loops (spec, code), each capped at 3 rounds, with a Needs Human escape
      hatch.
    prompt: |
      ## Kandev navigation protocol (applies to every step)

      You are one step of a Kandev workflow task. Your task_id and workflow_id are
      in the session context.

      The persistent task PLAN (create_task_plan_kandev / get_task_plan_kandev /
      update_task_plan_kandev) is the single source of truth for this task.
      Verdicts, rationale, and the round counters live there — never rely on chat
      history, which is reset between several steps.

      Each step's prompt starts with either a MOVEMENT DISCIPLINE block (you choose
      the next step) or a STEP COMPLETION block (the workflow advances you). Follow
      whichever THIS step has.

      MOVEMENT DISCIPLINE steps — to move the task on:
        1. list_workflow_steps_kandev(workflow_id)  -> step names to ids
        2. move_task_kandev(task_id, workflow_id, workflow_step_id=<target id>,
           prompt="<short factual handoff, <= 2 sentences>")
        3. STOP. That call is the LAST action of your turn. Call it exactly ONCE,
           then end your turn. Do NOT keep working. Do NOT advance the task past the
           step you moved it to — a step that runs no agent (e.g. "Human Review") is
           a DELIBERATE HUMAN GATE. Moving a task through a human gate is a serious
           error.

      STEP COMPLETION steps — do the step's work, then call step_complete_kandev and
      end your turn. Do NOT call move_task_kandev on these steps. If you are blocked,
      do not signal — just end your turn and the task waits for a human.

      Never argue your case in the move `prompt`. A fresh-context reviewer must
      form its own judgment from the plan and the repository, not from your
      framing. All substance goes in the plan.

    steps:
      - name: Backlog
        position: 0
        color: bg-neutral-400
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        events: {}

      - name: Draft
        position: 1
        color: bg-purple-500
        is_start_step: true
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: acceptEdits
        events:
          on_enter:
            - type: enable_plan_mode
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
          on_exit:
            - type: disable_plan_mode
        prompt: |
          [STEP COMPLETION - this step advances on its own]
          - You do NOT move the task and you do NOT call move_task_kandev. When your
            work for THIS step is finished, call step_complete_kandev and end your
            turn - the workflow then advances the task to the next step ("Review -
            Spec") automatically.
          - Calling move_task_kandev here is an error; it can skip a gate.
          - If you are blocked, a requirement is unclear, or a human must decide: do
            NOT call step_complete_kandev - just end your turn. The task stays on
            this step for a human.
          - PLAN MODE IS ON here: you cannot create or edit any file. Write only into
            the task plan; a later step writes files. Ignore any note telling you to
            write or commit a file here.

          [DRAFT - task-level implementation spec]
          Plan mode is ON: you cannot change files. This phase is design only.

          {{task_prompt}}

          ROUND CHECK: the plan may already contain "Revision round: N" and one or
          more "## Spec review round K - REJECTED" sections. If so this is a
          revision: read every objection, address each, and increment the counter.
          Otherwise this is round 1.

          1. READ THE FEATURE DOC. Find and read the design/feature document this
             task refers to. It lives in the repo's design-doc directory - detect
             which one this repo uses (look for an existing `docs/**/specs/` such
             as `docs/superpowers/specs/`, else `docs/specs/`); do not assume.
             Your spec MUST stay within its scope. If it is missing or the task
             falls outside it, call ask_user_question_kandev and stop.
          2. SKILLS. Invoke the `architecture-review` and `clean-code` skills.
          3. EXPLORE. Similar features, the relevant architecture, integration
             points, existing test patterns, and the repo's test command.
          4. WRITE THE SPEC:
             - problem statement + success criteria
             - 2-3 approaches with trade-offs (name what each gives up) + a pick
             - files to create/modify and each one's responsibility
             - every behavior phrased as a testable assertion
             - edge cases, error paths, explicit out-of-scope notes
             - mermaid for diagrams
          5. SAVE + SIGNAL DONE:
             - create_task_plan_kandev (or update_task_plan_kandev on a revision)
             - put "Revision round: N" near the top
             - do not create any other file
             - call step_complete_kandev, then end your turn. The workflow advances
               the task to "Review - Spec" (first of two independent reviews: Claude
               on the spec's correctness, then Codex on the approach).

      # First of two independent spec reviews. Fresh Claude session; correctness lens.
      - name: Review - Spec
        position: 2
        color: bg-cyan-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: acceptEdits
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
        prompt: |
          [MOVEMENT DISCIPLINE - read before acting]
          - Move the task to EXACTLY ONE step: the target named in THIS step's own
            instructions below. Never a step further ahead. Never "Done", "Commit Doc",
            "Commit", "Integrate", or "Needs Human" unless THIS prompt names it as your
            target.
          - The move is ONE tool call, made once, as the final action of your turn:
              move_task_kandev(task_id, workflow_id, workflow_step_id=<id>, prompt="<handoff>")
            Get <id> from list_workflow_steps_kandev(workflow_id) - it is the target
            step's id, NOT its name. The handoff argument is named `prompt`; there is
            no `message` and no `step` argument. After the call, end the turn - do not
            call move_task_kandev again and do not keep working.
          - If you are unsure where to go, STOP and end the turn WITHOUT moving - a
            human will unstick you. Do not guess forward.
          - Steps that run no agent (Human Approval / Human Review / Done) are hard
            gates. Moving a task into or past one is a serious error. Nothing
            structural catches it - this block is the only guard.

          [SPEC REVIEW - fresh session, first of two independent review gates]
          Fresh session. No memory of prior rounds. You are the FIRST of two
          independent reviewers (you, then Codex). Review the spec as an
          independent critic; do not assume the drafting agent got it right.

          1. READ: get_task_plan_kandev (full spec + all prior review rounds); the
             feature doc in the repo's design-doc directory (`docs/**/specs/` or
             `docs/specs/` - whichever this repo uses); enough of the codebase to
             judge implementability. Note "Revision round: N".
          2. REVIEW: invoke the `architecture-review` skill and apply it. Your lens
             is CORRECTNESS AND COMPLETENESS (Codex takes the approach/risk lens
             next, so weight those less here):
             - implementability against the real codebase
             - architecture: layer fit, dependency direction, coupling, real vs
               speculative abstractions
             - completeness: every behavior a testable assertion; edge cases,
               error paths, the unhappy path, test coverage of each behavior
             - the spec stays within the feature doc's scope and is one coherent
               thing
             - every objection from earlier "## Spec review round" sections is
               actually resolved
          3. VERDICT: update_task_plan_kandev, append:
               ## Spec review round N - APPROVED|REJECTED by Claude Spec Review
               (REJECTED: numbered objections with why + fix. APPROVED: one line.)
          4. ROUTE:
             - APPROVED -> move to "Review - Codex". Handoff: "Claude spec review
               passed, round N."
             - REJECTED and N < 3 -> move to "Draft". Handoff: "Rejected round N."
             - REJECTED and N >= 3 -> move to "Needs Human".
               Handoff: "Stalled round N: <one-line core disagreement>."
             One move_task_kandev call, then end your turn.

      # Second, independent spec review by a different vendor (Codex). Approach/risk
      # lens; last gate before Implement. Bind the `codex` profile in the UI.
      - name: Review - Codex
        position: 3
        color: bg-sky-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Codex
          model: gpt-5.6-sol
          mode: agent
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
        prompt: |
          [MOVEMENT DISCIPLINE - read before acting]
          - Move the task to EXACTLY ONE step: the target named in THIS step's own
            instructions below. Never a step further ahead. Never "Done", "Commit Doc",
            "Commit", "Integrate", or "Needs Human" unless THIS prompt names it as your
            target.
          - The move is ONE tool call, made once, as the final action of your turn:
              move_task_kandev(task_id, workflow_id, workflow_step_id=<id>, prompt="<handoff>")
            Get <id> from list_workflow_steps_kandev(workflow_id) - it is the target
            step's id, NOT its name. The handoff argument is named `prompt`; there is
            no `message` and no `step` argument. After the call, end the turn - do not
            call move_task_kandev again and do not keep working.
          - If you are unsure where to go, STOP and end the turn WITHOUT moving - a
            human will unstick you. Do not guess forward.
          - Steps that run no agent (Human Approval / Human Review / Done) are hard
            gates. Moving a task into or past one is a serious error. Nothing
            structural catches it - this block is the only guard.

          [CODEX SPEC REVIEW - fresh session, second and final spec gate]
          Fresh session, different model vendor. Claude has already reviewed this
          spec for correctness and approved it. You are the SECOND, independent
          review and the last gate before implementation - be exacting. Do not
          assume Claude or the drafter got it right.

          Your lens is APPROACH AND RISK, not style:
            - Is this the right approach at all? Name a materially simpler design
              if one exists.
            - Hidden or unstated assumptions the spec depends on.
            - What breaks in production: failure paths, partial failures,
              concurrency, scale, migrations / rollout, backward compatibility.
            - Scope creep vs the feature doc; speculative generality.
            - Risks the drafter and the first reviewer both missed.
          Do NOT re-litigate naming, formatting, or test-by-test wording - that
          was the first review's job.

          1. READ: get_task_plan_kandev (full spec + all prior review rounds,
             including "## Spec review round N ... by Claude Spec Review"); the
             feature doc in the repo's design-doc directory (`docs/**/specs/` or
             `docs/specs/`); enough of the codebase to judge the approach. Note
             "Revision round: N".
          2. REVIEW along the lens above.
          3. VERDICT: update_task_plan_kandev, append:
               ## Spec review round N - APPROVED|REJECTED by Codex Spec Review
               (REJECTED: numbered objections with why + fix. APPROVED: one line.)
          4. ROUTE:
             - APPROVED -> move to "Implement". Handoff: "Both spec reviews passed,
               round N."
             - REJECTED and N < 3 -> move to "Draft". Handoff: "Codex rejected
               round N."
             - REJECTED and N >= 3 -> move to "Needs Human".
               Handoff: "Stalled round N: <one-line core disagreement>."
             One move_task_kandev call, then end your turn.

      - name: Implement
        position: 4
        color: bg-blue-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: acceptEdits
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        prompt: |
          [STEP COMPLETION - this step advances on its own]
          - You do NOT move the task and you do NOT call move_task_kandev. When your
            work for THIS step is finished, call step_complete_kandev and end your
            turn - the workflow then advances the task to the next step ("Test")
            automatically.
          - Calling move_task_kandev here is an error; it can skip a gate.
          - If you are blocked, a requirement is unclear, you have failed 3 times on
            one issue, or the plan needs an architectural change it did not
            anticipate: do NOT call step_complete_kandev - just end your turn (after
            recording the blocker in the plan). The task stays here for a human.

          [IMPLEMENT]
          Fresh session. Permission mode: Accept Edits.

          {{task_prompt}}

          ROUND CHECK: the plan may contain "Build round: M" plus "## Test round" or
          "## Code review round" sections from a prior attempt. If so, read them,
          fix every issue, and increment M. Otherwise M = 1.

          1. READ THE APPROVED PLAN: get_task_plan_kandev. Implement exactly what it
             specifies - it passed review. If you believe it is wrong, stop and call
             ask_user_question_kandev; do not silently deviate.
          2. TDD. Invoke the `clean-code` skill. For each behavior:
             failing test -> confirm it fails right -> minimum code -> green ->
             refactor -> commit (explicit paths, never `git add .`).
             Follow codebase conventions. Small functions, meaningful names,
             nesting <= 3, no dead or speculative code.
          3. STOP CONDITIONS: blocker, unclear requirement, 3 failed attempts on one
             issue, or a fix needing an architectural change the plan didn't
             anticipate -> record it in the plan, end your turn, do NOT signal done.
          4. SIGNAL DONE: commit all YOUR task changes (leave unrelated uncommitted
             work alone). Put "Build round: M" in the plan. Call step_complete_kandev
             and end your turn - the workflow advances the task to "Test".

      # Cold verification runs on Codex (different vendor from the implementer).
      - name: Test
        position: 5
        color: bg-teal-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Codex
          model: gpt-5.6-sol
          mode: agent-full-access
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
        prompt: |
          [MOVEMENT DISCIPLINE - read before acting]
          - Move the task to EXACTLY ONE step: the target named in THIS step's own
            instructions below. Never a step further ahead. Never "Done", "Commit Doc",
            "Commit", "Integrate", or "Needs Human" unless THIS prompt names it as your
            target.
          - The move is ONE tool call, made once, as the final action of your turn:
              move_task_kandev(task_id, workflow_id, workflow_step_id=<id>, prompt="<handoff>")
            Get <id> from list_workflow_steps_kandev(workflow_id) - it is the target
            step's id, NOT its name. The handoff argument is named `prompt`; there is
            no `message` and no `step` argument. After the call, end the turn - do not
            call move_task_kandev again and do not keep working.
          - If you are unsure where to go, STOP and end the turn WITHOUT moving - a
            human will unstick you. Do not guess forward.
          - Steps that run no agent (Human Approval / Human Review / Done) are hard
            gates. Moving a task into or past one is a serious error. Nothing
            structural catches it - this block is the only guard.

          [TEST - cold verification]
          Fresh session, and a different model vendor from the implementer (you are
          Codex; Claude wrote this code). You did not write it. Find out whether it
          works and whether it is really tested - do not defend it.

          1. READ: get_task_plan_kandev - the behaviors that must exist. Note
             "Build round: M".
          2. RUN THE FULL SUITE. Find the test command (package.json scripts /
             Makefile / etc.). Run the entire suite, plus any linter / typecheck.
          3. VERIFY THE TESTS ARE REAL. For each behavior in the plan: a test
             exists that exercises it, it passes, and it asserts something
             meaningful (reject assert(true), empty bodies, tests that never call
             the code under test).
          4. VERDICT + ROUTE. update_task_plan_kandev, append:
               ## Test round M - PASS|FAIL
               (FAIL: exact failing output, which behavior, file:line)
             - PASS -> move to "Code Review". Handoff: "Tests pass, build round M."
             - FAIL and M < 3 -> move to "Implement". Handoff: "Test failures, round M."
             - FAIL and M >= 3 -> move to "Needs Human".

      - name: Code Review
        position: 6
        color: bg-orange-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Claude
          model: sonnet
          mode: acceptEdits
        events:
          on_enter:
            - type: reset_agent_context
            - type: auto_start_agent
        prompt: |
          [MOVEMENT DISCIPLINE - read before acting]
          - Move the task to EXACTLY ONE step: the target named in THIS step's own
            instructions below. Never a step further ahead. Never "Done", "Commit Doc",
            "Commit", "Integrate", or "Needs Human" unless THIS prompt names it as your
            target.
          - The move is ONE tool call, made once, as the final action of your turn:
              move_task_kandev(task_id, workflow_id, workflow_step_id=<id>, prompt="<handoff>")
            Get <id> from list_workflow_steps_kandev(workflow_id) - it is the target
            step's id, NOT its name. The handoff argument is named `prompt`; there is
            no `message` and no `step` argument. After the call, end the turn - do not
            call move_task_kandev again and do not keep working.
          - If you are unsure where to go, STOP and end the turn WITHOUT moving - a
            human will unstick you. Do not guess forward.
          - Steps that run no agent (Human Approval / Human Review / Done) are hard
            gates. Moving a task into or past one is a serious error. Nothing
            structural catches it - this block is the only guard.

          [CODE REVIEW - security, architecture, quality]
          Fresh session. Review ONLY the diff on this branch, plus the plan for intent.

          1. SCOPE THE DIFF against the BASE BRANCH this task branched from - NOT
             the repo's default branch. The repo default (often `main`) may be far
             behind the real base (commonly `dev` here); diffing against it pulls
             in unrelated files. Determine the base from the task's configuration /
             the branch this worktree tracks, then:
             - git diff <base>...HEAD --name-only          (committed)
             - git diff HEAD --name-only ; git ls-files --others --exclude-standard
             Review the union. Read each file from the working tree.
          2. REVIEW. Invoke `clean-code` and `architecture-review`.
             - SECURITY (blockers): secrets in code; missing input validation at
               boundaries; injection (SQL/XSS/command/path); missing auth on new
               endpoints.
             - ARCHITECTURE: correct layer; dependency direction; domain logic out
               of transport/controllers/infra; no bypassed boundaries; abstractions
               are real boundaries.
             - QUALITY: naming; small focused functions; no dead/commented-out/
               speculative code; nesting <= 3; comments say why not what.
          3. FIX OR REPORT. Fix trivial issues directly and commit with an
             explicit-path `review:` message. Record author-facing issues in the
             plan with file:line, why, and fix. Only findings you are >= 80%
             confident about. Do not comment on unmodified code.
          4. VERDICT + ROUTE. update_task_plan_kandev, append:
               ## Code review round M - PASS|CHANGES REQUIRED
               (findings)
             - PASS -> move to "Human Review". Handoff: "Code review clean, round M."
             - CHANGES REQUIRED and M < 3 -> move to "Implement".
               Handoff: "Code review changes, round M."
             - CHANGES REQUIRED and M >= 3 -> move to "Needs Human".
             Then STOP immediately. "Human Review" runs no agent - it is Sharif's
             gate. After your single move_task_kandev call, end your turn. Do NOT
             move the task again. Do NOT proceed to Integrate.

      - name: Human Review
        position: 7
        color: bg-yellow-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        events: {}
        prompt: |
          [HUMAN REVIEW GATE - no agent runs here]
          Sharif reviews the branch diff in Kandev's changes panel.
          - Approve  -> drag the task to "Integrate".
          - Changes  -> add a comment / edit the plan and drag it back to "Implement".

      # PR packaging runs on Codex.
      - name: Integrate
        position: 8
        color: bg-indigo-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: true
        cancel_triggers_turn_complete: false
        agent_profile:
          agent_name: Codex
          model: gpt-5.6-sol
          mode: agent-full-access
        events:
          on_enter:
            - type: auto_start_agent
          on_turn_complete:
            - type: move_to_next
        prompt: |
          [STEP COMPLETION - this step advances on its own]
          - You do NOT move the task and you do NOT call move_task_kandev. When the
            PR is open, call step_complete_kandev and end your turn - the workflow
            then advances the task to "Done" automatically. "Done" is terminal.
          - Calling move_task_kandev here is an error; it can skip a gate.
          - If you cannot open the PR (push fails, CI cannot be made green, base
            branch unclear): record why in the plan, end your turn, do NOT call
            step_complete_kandev. The task stays here for a human.

          [INTEGRATE]
          The human approved the diff. Package it as a PR for the human to merge -
          you do NOT merge it yourself.

          1. PREPARE: run the repo's formatters/linters; restore unrelated touched
             files with explicit paths; commit any remaining task changes (explicit
             paths, conventional message).
          2. BASE BRANCH: never assume `main`. The PR target is the branch this
             task was cut from - take it from the task's configuration / the branch
             this worktree tracks. Common here: `dev` (not `main`, never
             `cloud-env` / a prod branch).
          3. PR: push the branch. Check for .github/pull_request_template.md and
             follow it. `gh pr create --base <base branch from step 2>
             --title "<conventional commit title>"
             --body "<summary of commits, validation done (tests/review), and a
             pointer to the QA/tester checklist if one exists>"`. Not a draft.
          4. CI: if the repo has CI, `gh pr checks <n>`, poll every 30s up to
             10 min; fix failures (`gh run view <id> --log-failed`), commit, push,
             re-poll so the human sees a green PR. If no CI, continue.
          5. DO NOT MERGE. DO NOT run `gh pr merge`. DO NOT approve, close, or
             squash the PR. Every PR in this project is merged deliberately by a
             human after their own final read. Merging it yourself is a serious
             error.
          6. SIGNAL DONE: record the PR URL in the plan. Then call step_complete_kandev
             and END YOUR TURN. Do not do further cleanup. The workflow moves the
             task to "Done" - terminal.

      - name: Done
        position: 9
        color: bg-green-500
        is_start_step: false
        show_in_command_panel: false
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        auto_archive_after_hours: 168
        events: {}

      - name: Needs Human
        position: 10
        color: bg-red-500
        is_start_step: false
        show_in_command_panel: true
        allow_manual_move: true
        auto_advance_requires_signal: false
        cancel_triggers_turn_complete: false
        events: {}
        prompt: |
          [NEEDS HUMAN - a loop hit its 3-round cap]
          Read the task plan's review/test/code-review rounds to see the
          disagreement. Then either: edit the plan and drag to the right step, send
          it back to "Draft" with a ruling, or archive the task.
